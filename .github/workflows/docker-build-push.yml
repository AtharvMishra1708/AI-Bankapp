name: Docker Build & Push

on:
    
    workflow_call:

jobs:
    Build-Push:
        runs-on: ubuntu-latest
        steps:

            - name: code checkout
              uses: actions/checkout@v4

             # 🌟 STEP 1: Clear out massive pre-installed software to prevent disk crashes
            - name: Free Disk Space on Runner Computer
              run: |
                echo "Reclaiming local storage space on GitHub runner..."
                sudo rm -rf /usr/share/dotnet
                sudo rm -rf /usr/local/lib/android
                sudo rm -rf /opt/ghc
                sudo rm -rf "/usr/local/share/boost"

            - name: Login to Dockerhub
              uses: docker/login-action@v3
              with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

            - name: Build & Push to dockerhub
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                    ${{ vars.DOCKERHUB_USERNAME }}/ai-bank-app:${{ github.sha }}
                    ${{ vars.DOCKERHUB_USERNAME }}/ai-bank-app:latest