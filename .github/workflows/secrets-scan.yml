# using gitleaks to scan the secrets

name: Secrets-Scan

on:
    
    workflow_call:

jobs:
    security-scan:
        runs-on: ubuntu-latest
        steps:

            - name: code checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            
            - name: using GitLeaks to check the secrets
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}